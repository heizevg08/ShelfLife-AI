services:
  - type: web
    name: shelflife-ai-api
    # The API and the bundled forecasting worker require both Node and Python.
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health/live
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: TRUST_PROXY
        value: "true"
      - key: COOKIE_SAME_SITE
        value: none
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      # The Docker image supplies Python and the worker script. These are public
      # runtime paths, not credentials, and may be overridden in Render if needed.
      - key: ML_PYTHON_EXECUTABLE
        value: python3
      - key: ML_WORKER_SCRIPT
        value: ml/src/10_persistent_inference_worker.py
