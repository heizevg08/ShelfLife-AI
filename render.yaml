services:
  - type: web
    name: shelflife-ai-api
    runtime: node
    buildCommand: npm ci --include=dev && npm run build --workspace server && curl -LsSf https://astral.sh/uv/install.sh | env UV_UNMANAGED_INSTALL="$PWD/ml/.uv" sh && UV_PYTHON_DOWNLOADS=automatic UV_PYTHON_INSTALL_DIR="$PWD/ml/.uv-python" "$PWD/ml/.uv/uv" venv ml/.venv --managed-python --python 3.14.7 && "$PWD/ml/.uv/uv" pip install --python ml/.venv/bin/python -r ml/requirements-runtime.txt
    startCommand: npm run start --workspace server
    healthCheckPath: /api/health/live
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: TRUST_PROXY
        value: "true"
      - key: COOKIE_SAME_SITE
        value: none
      - key: ML_PYTHON_EXECUTABLE
        value: ml/.venv/bin/python
      - key: ML_WORKER_SCRIPT
        value: ml/src/10_persistent_inference_worker.py
      - key: ML_STARTUP_TIMEOUT_MS
        value: "60000"
      - key: ML_INFERENCE_TIMEOUT_MS
        value: "30000"
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: PASSWORD_RESET_URL
        value: https://shelflife-ai-one.vercel.app/ShelfLifeAILogin
      - key: ACCOUNT_LOGIN_URL
        value: https://shelflife-ai-one.vercel.app/ShelfLifeAILogin
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "2525"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: SMTP_FROM_NAME
        value: ShelfLife AI
